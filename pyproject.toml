[project]
name = "workout-tracker"
version = "0.1.0"
description = "Privacy-preserving spreadsheet-first workout tracker"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.198,<3",
    "google-auth>=2.56,<3",
    "pydantic>=2.13,<3",
    "PyYAML>=6.0,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests/unit",
    "tests/contract",
    "tests/uat",
]
markers = [
    "google_uat: live tests that require an explicitly approved disposable Google Spreadsheet",
]
addopts = [
    "--strict-markers",
]

[tool.workout_tracker.dependency_policy]
approval = "D-20"
registry = "https://pypi.org"

[tool.workout_tracker.dependency_policy.sources]
google-api-python-client = "https://github.com/googleapis/google-api-python-client"
google-auth = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-auth"
pydantic = "https://github.com/pydantic/pydantic"
pytest = "https://github.com/pytest-dev/pytest"
pyyaml = "https://github.com/yaml/pyyaml"
