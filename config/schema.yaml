---
contract:
  id: "workout-tracker-source-contract"
  schema_version: "1.1.0"
  status: "normative"
  effective_date: "2026-07-24"
  documentation_locale: "uk-UA"
  spreadsheet_locale:
    source: "spreadsheet_properties.locale"
    required: true
  spreadsheet_time_zone:
    source: "spreadsheet_properties.timeZone"
    required: true
  encoding: "UTF-8"
  documentation: "docs/architecture/DATA_MODEL.md"

versions:
  schema:
    current: "1.1.0"
    accepted:
      - "1.0.0"
      - "1.1.0"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  program:
    pattern: "^program-v[0-9]+\\.[0-9]+\\.[0-9]+$"
    value_is_supplied_by: "google_sheets_program_owner"
  normalizer:
    current: "normalizer-v1"
    pattern: "^normalizer-v[0-9]+$"
  formulas:
    current: "metrics-v1"
    pattern: "^metrics-v[0-9]+$"

authority:
  schema:
    owner: "git"
    path: "config/schema.yaml"
  program_prescriptions:
    owner: "google_sheets"
    tab: "Програма"
    version_key: "program_version_id"
    human_bootstrap_sources:
      - "4-day upper lower program/README.md"
      - "4-day upper lower program/01 upper strength.md"
      - "4-day upper lower program/02 lower strength.md"
      - "4-day upper lower program/03 upper hypertrophy.md"
      - "4-day upper lower program/04 lower hypertrophy.md"
      - "4-day upper lower program/05 progression and session rules.md"
    git_mirror_if_created: "config/program.yaml"
    git_mirror_authoritative: false
  training_facts:
    owner: "google_sheets"
    tabs:
      - "Сесії"
      - "Підходи"
  recommendation_journal:
    owner: "google_sheets"
    tab: "Рекомендації"
  sheet_calculations:
    owner: "google_sheets_formulas"
    authoritative: false
    use_as_analytical_evidence: false
  local_derived_data:
    owner: "local_pipeline"
    authoritative_for_source_facts: false
    requires:
      - "snapshot_id"
      - "source_payload_sha256"
      - "schema_version"
      - "normalizer_version"
      - "formula_version_when_applicable"

source:
  system: "google_sheets"
  spreadsheet_id:
    storage: "runtime_configuration"
    config_key: "WORKOUT_SHEET_ID"
    value_in_contract: null
  required_tabs:
    - "Програма"
    - "Сесії"
    - "Підходи"
    - "Рекомендації"
  header_row: 1
  blank_cell_policy: "null"
  row_number_is_identity: false
  source_version:
    preferred: "connector_opaque_version_or_etag"
    fallback: "snapshot_content_sha256"

data_classes:
  source_fact:
    description: "Значення, яким володіє визначене джерело; raw snapshot зберігає його без змін."
  sheet_calculated:
    description: "Кеш від формули для показу; не є фактом і не є входом локальних метрик."
  local_derived:
    description: "Значення, обчислене локально з версійованою формулою та повним lineage."

id_policy:
  generation_owner: "source_writer"
  immutable: true
  row_position_forbidden: true
  content_derived_fallback_forbidden: true
  missing_id_action: "quarantine"
  legacy_backfill:
    mode: "explicit_source_migration"
    persist_to_source_before_import: true
    normalizer_must_not_backfill: true
  formats:
    program_item_id:
      pattern: "^prg_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    program_version_id:
      pattern: "^pver_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    session_id:
      pattern: "^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    set_id:
      pattern: "^set_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    recommendation_id:
      pattern: "^rec_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    snapshot_id:
      pattern: "^snp_[0-9a-f]{64}$"

revision_policy:
  field: "source_revision"
  first_revision: 1
  increment_on_source_fact_change: true
  entity_key: "stable_id"
  immutable_local_version_key:
    - "entity_id"
    - "source_revision"
    - "source_payload_sha256"
  same_revision_different_payload: "fatal"
  lower_revision_after_higher_revision: "error"
  physical_delete_forbidden: true
  deletion_representation: "entity_specific_void_or_inactive_status"
  complete_snapshot_absence:
    local_action: "create_tombstone_revision"
    source_fact_inference: "none"
    partial_snapshot_action: "never_tombstone"

canonical_workout_types:
  upper_strength:
    source_label: "Верх — сила"
    internal_alias: "upper_strength"
  lower_strength:
    source_label: "Низ — сила"
    internal_alias: "lower_strength"
  upper_hypertrophy:
    source_label: "Верх — гіпертрофія"
    internal_alias: "upper_hypertrophy"
  lower_hypertrophy:
    source_label: "Низ — гіпертрофія"
    internal_alias: "lower_hypertrophy"
  sheet_accepts_internal_alias: false

enums:
  program_version_status:
    - "active"
    - "retired"
  program_item_status:
    - "active"
    - "inactive"
  session_status:
    - "writing"
    - "complete"
    - "void"
  set_status:
    - "completed"
    - "partial"
    - "skipped"
    - "void"
  set_role:
    - "warmup"
    - "working"
    - "backoff"
  measurement_kind:
    - "repetitions"
    - "duration"
    - "repetitions_and_duration"
  laterality:
    - "bilateral"
    - "alternating_total"
    - "unilateral_both"
    - "left_only"
    - "right_only"
  load_unit:
    - "kg"
    - "lb"
    - "machine_level"
  load_basis:
    - "total_external"
    - "per_implement"
    - "machine_stack"
    - "added_to_bodyweight"
    - "assistance"
    - "bodyweight_only"
  generated_by:
    - "human"
    - "rules_engine"
    - "llm"
  recommendation_scope:
    - "exercise_variant"
    - "exercise_family"
    - "workout_type"
    - "program"
    - "recovery"
  recommendation_type:
    - "deterministic_progression"
    - "program_change"
    - "volume_change"
    - "exercise_substitution"
    - "recovery_flag"
    - "technique_review"
  recommendation_status:
    - "proposed"
    - "accepted"
    - "rejected"
    - "expired"
    - "superseded"
    - "void"
  recommendation_outcome:
    - "successful"
    - "mixed"
    - "unsuccessful"
    - "not_evaluated"

common_types:
  schema_version:
    type: "string"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  program_version:
    type: "string"
    pattern: "^program-v[0-9]+\\.[0-9]+\\.[0-9]+$"
  source_revision:
    type: "integer"
    minimum: 1
  date:
    type: "date"
    format: "YYYY-MM-DD"
  datetime:
    type: "datetime"
    format: "RFC3339_with_utc_offset"
  short_text:
    type: "string"
    max_length: 500
  long_text:
    type: "string"
    max_length: 5000
  canonical_slug:
    type: "string"
    pattern: "^[a-z][a-z0-9_]{1,63}$"
  comparison_cohort_id:
    type: "string"
    pattern: "^coh_[0-9a-f]{64}$"
  sha256:
    type: "string"
    pattern: "^[0-9a-f]{64}$"

sheet_tabs:
  program:
    title: "Програма"
    authority_role: "operational_program_prescriptions"
    entity: "program_item"
    primary_key: "program_item_id"
    group_entity:
      name: "program_version"
      key: "program_version_id"
      invariant_fields:
        - "schema_version"
        - "program_version"
        - "program_version_status"
        - "published_at"
    columns:
      - field: "program_item_id"
        header: "ID елемента програми"
        type: "string"
        pattern_ref: "id_policy.formats.program_item_id.pattern"
        nullable: false
        data_class: "source_fact"
      - field: "schema_version"
        header: "Версія схеми"
        type_ref: "common_types.schema_version"
        nullable: false
        data_class: "source_fact"
      - field: "program_version_id"
        header: "ID версії програми"
        type: "string"
        pattern_ref: "id_policy.formats.program_version_id.pattern"
        nullable: false
        data_class: "source_fact"
      - field: "program_version"
        header: "Версія програми"
        type_ref: "common_types.program_version"
        nullable: false
        data_class: "source_fact"
      - field: "program_version_status"
        header: "Статус версії програми"
        type: "string"
        enum_ref: "enums.program_version_status"
        nullable: false
        data_class: "source_fact"
      - field: "source_revision"
        header: "Ревізія джерела"
        type_ref: "common_types.source_revision"
        nullable: false
        data_class: "source_fact"
      - field: "published_at"
        header: "Опубліковано о"
        type_ref: "common_types.datetime"
        nullable: false
        data_class: "source_fact"
      - field: "status"
        header: "Статус елемента"
        type: "string"
        enum_ref: "enums.program_item_status"
        nullable: false
        data_class: "source_fact"
      - field: "workout_type"
        header: "Тип тренування"
        type: "string"
        enum_source_ref: "canonical_workout_types.*.source_label"
        nullable: false
        data_class: "source_fact"
      - field: "block_code"
        header: "Код блоку"
        type: "string"
        pattern: "^[A-Z][0-9]?$"
        nullable: false
        data_class: "source_fact"
      - field: "exercise_order"
        header: "Порядок вправи"
        type: "integer"
        minimum: 1
        maximum: 100
        nullable: false
        data_class: "source_fact"
      - field: "exercise_family_id"
        header: "ID сімейства вправи"
        type_ref: "common_types.canonical_slug"
        nullable: false
        data_class: "source_fact"
      - field: "exercise_variant_id"
        header: "ID варіанта вправи"
        type_ref: "common_types.canonical_slug"
        nullable: false
        data_class: "source_fact"
      - field: "comparison_cohort_id"
        header: "ID когорти порівняння"
        type_ref: "common_types.comparison_cohort_id"
        nullable: true
        data_class: "source_fact"
      - field: "equipment_id"
        header: "ID обладнання"
        type_ref: "common_types.canonical_slug"
        nullable: true
        data_class: "source_fact"
      - field: "setup_id"
        header: "ID налаштування"
        type_ref: "common_types.canonical_slug"
        nullable: true
        data_class: "source_fact"
      - field: "exercise_name"
        header: "Назва вправи"
        type: "string"
        min_length: 1
        max_length: 200
        nullable: false
        data_class: "source_fact"
      - field: "primary_muscle_group_id"
        header: "ID основної групи м'язів"
        type_ref: "common_types.canonical_slug"
        nullable: false
        data_class: "source_fact"
      - field: "set_role"
        header: "Роль підходу"
        type: "string"
        enum_ref: "enums.set_role"
        nullable: false
        data_class: "source_fact"
      - field: "target_sets"
        header: "Цільові підходи"
        type: "integer"
        minimum: 1
        maximum: 20
        nullable: false
        data_class: "source_fact"
      - field: "prescribed_optional"
        header: "Опціональний блок"
        type: "boolean"
        nullable: false
        data_class: "source_fact"
      - field: "measurement_kind"
        header: "Тип вимірювання"
        type: "string"
        enum_ref: "enums.measurement_kind"
        nullable: false
        data_class: "source_fact"
      - field: "laterality"
        header: "Сторонність"
        type: "string"
        enum_ref: "enums.laterality"
        nullable: false
        data_class: "source_fact"
      - field: "target_reps_min"
        header: "Мінімум повторів"
        type: "integer"
        minimum: 1
        maximum: 1000
        nullable: true
        data_class: "source_fact"
      - field: "target_reps_max"
        header: "Максимум повторів"
        type: "integer"
        minimum: 1
        maximum: 1000
        nullable: true
        data_class: "source_fact"
      - field: "target_duration_seconds_min"
        header: "Мінімум тривалості, с"
        type: "decimal"
        exclusive_minimum: 0
        maximum: 86400
        nullable: true
        data_class: "source_fact"
      - field: "target_duration_seconds_max"
        header: "Максимум тривалості, с"
        type: "decimal"
        exclusive_minimum: 0
        maximum: 86400
        nullable: true
        data_class: "source_fact"
      - field: "target_rir_min"
        header: "Мінімальний RIR"
        type: "decimal"
        minimum: 0
        maximum: 10
        nullable: false
        data_class: "source_fact"
      - field: "target_rir_max"
        header: "Максимальний RIR"
        type: "decimal"
        minimum: 0
        maximum: 10
        nullable: false
        data_class: "source_fact"
      - field: "rest_seconds_min"
        header: "Мінімальний відпочинок, с"
        type: "integer"
        minimum: 0
        maximum: 3600
        nullable: true
        data_class: "source_fact"
      - field: "rest_seconds_max"
        header: "Максимальний відпочинок, с"
        type: "integer"
        minimum: 0
        maximum: 3600
        nullable: true
        data_class: "source_fact"
      - field: "load_increment_value"
        header: "Крок навантаження"
        type: "decimal"
        exclusive_minimum: 0
        maximum: 1000
        nullable: true
        data_class: "source_fact"
      - field: "load_increment_unit"
        header: "Одиниця кроку"
        type: "string"
        enum_ref: "enums.load_unit"
        nullable: true
        data_class: "source_fact"
      - field: "load_increment_basis"
        header: "База кроку"
        type: "string"
        enum_ref: "enums.load_basis"
        nullable: true
        data_class: "source_fact"
      - field: "expected_implement_count"
        header: "Очікувана кількість снарядів"
        type: "integer"
        minimum: 1
        maximum: 8
        nullable: true
        data_class: "source_fact"
      - field: "priority"
        header: "Пріоритет"
        type: "integer"
        minimum: 1
        maximum: 5
        nullable: false
        data_class: "source_fact"
      - field: "technical_notes"
        header: "Технічні нотатки"
        type_ref: "common_types.long_text"
        nullable: true
        data_class: "source_fact"
      - field: "definition_sha256"
        header: "SHA-256 визначення"
        type_ref: "common_types.sha256"
        nullable: false
        data_class: "source_fact"

  sessions:
    title: "Сесії"
    authority_role: "training_facts"
    entity: "session"
    primary_key: "session_id"
    columns:
      - field: "session_id"
        header: "ID сесії"
        type: "string"
        pattern_ref: "id_policy.formats.session_id.pattern"
        nullable: false
        data_class: "source_fact"
      - field: "schema_version"
        header: "Версія схеми"
        type_ref: "common_types.schema_version"
        nullable: false
        data_class: "source_fact"
      - field: "source_revision"
        header: "Ревізія джерела"
        type_ref: "common_types.source_revision"
        nullable: false
        data_class: "source_fact"
      - field: "created_at"
        header: "Створено о"
        type_ref: "common_types.datetime"
        nullable: false
        data_class: "source_fact"
      - field: "updated_at"
        header: "Оновлено о"
        type_ref: "common_types.datetime"
        nullable: false
        data_class: "source_fact"
      - field: "status"
        header: "Статус запису"
        type: "string"
        enum_ref: "enums.session_status"
        nullable: false
        data_class: "source_fact"
      - field: "program_version_id"
        header: "ID версії програми"
        type: "string"
        pattern_ref: "id_policy.formats.program_version_id.pattern"
        nullable: false
        data_class: "source_fact"
      - field: "session_date"
        header: "Дата"
        type_ref: "common_types.date"
        nullable: false
        data_class: "source_fact"
      - field: "workout_type"
        header: "Тип тренування"
        type: "string"
        enum_source_ref: "canonical_workout_types.*.source_label"
        nullable: false
        data_class: "source_fact"
      - field: "started_at"
        header: "Початок о"
        type_ref: "common_types.datetime"
        nullable: true
        data_class: "source_fact"
      - field: "completed_at"
        header: "Завершено о"
        type_ref: "common_types.datetime"
        nullable: true
        data_class: "source_fact"
      - field: "duration_minutes"
        header: "Тривалість, хв"
        type: "decimal"
        exclusive_minimum: 0
        maximum: 360
        nullable: true
        data_class: "source_fact"
      - field: "expected_set_count"
        header: "Очікувана кількість підходів"
        type: "integer"
        minimum: 0
        maximum: 500
        nullable: false
        data_class: "source_fact"
      - field: "body_mass_value"
        header: "Маса тіла"
        type: "decimal"
        exclusive_minimum: 0
        maximum: 1000
        nullable: true
        data_class: "source_fact"
      - field: "body_mass_unit"
        header: "Одиниця маси тіла"
        type: "string"
        allowed:
          - "kg"
          - "lb"
        nullable: true
        data_class: "source_fact"
      - field: "sleep_hours"
        header: "Сон, год"
        type: "decimal"
        minimum: 0
        maximum: 24
        nullable: true
        data_class: "source_fact"
      - field: "energy_score"
        header: "Енергія, 1–5"
        type: "integer"
        minimum: 1
        maximum: 5
        nullable: true
        data_class: "source_fact"
      - field: "stress_score"
        header: "Стрес, 1–5"
        type: "integer"
        minimum: 1
        maximum: 5
        nullable: true
        data_class: "source_fact"
      - field: "soreness_score"
        header: "Крепатура, 1–5"
        type: "integer"
        minimum: 1
        maximum: 5
        nullable: true
        data_class: "source_fact"
      - field: "performance_score"
        header: "Результативність, 1–5"
        type: "integer"
        minimum: 1
        maximum: 5
        nullable: true
        data_class: "source_fact"
      - field: "notes"
        header: "Нотатки"
        type_ref: "common_types.long_text"
        nullable: true
        data_class: "source_fact"
      - field: "void_reason"
        header: "Причина анулювання"
        type_ref: "common_types.short_text"
        nullable: true
        data_class: "source_fact"
      - field: "observed_set_count_sheet"
        header: "Факт підходів (формула)"
        type: "integer"
        minimum: 0
        maximum: 500
        nullable: true
        data_class: "sheet_calculated"
      - field: "working_set_count_sheet"
        header: "Робочі підходи (формула)"
        type: "integer"
        minimum: 0
        maximum: 500
        nullable: true
        data_class: "sheet_calculated"
      - field: "volume_sheet"
        header: "Обсяг (формула)"
        type: "decimal"
        minimum: 0
        nullable: true
        data_class: "sheet_calculated"
      - field: "average_rir_sheet"
        header: "Середній RIR (формула)"
        type: "decimal"
        minimum: 0
        maximum: 10
        nullable: true
        data_class: "sheet_calculated"
      - field: "average_rest_seconds_sheet"
        header: "Середній відпочинок, с (формула)"
        type: "decimal"
        minimum: 0
        maximum: 3600
        nullable: true
        data_class: "sheet_calculated"
      - field: "risk_flags_sheet"
        header: "Прапорці ризику (формула)"
        type: "json_array"
        nullable: true
        data_class: "sheet_calculated"
      - field: "sheet_formula_version"
        header: "Версія формул таблиці"
        type: "string"
        pattern_ref: "versions.formulas.pattern"
        nullable: true
        data_class: "sheet_calculated"

  sets:
    title: "Підходи"
    authority_role: "training_facts"
    entity: "set"
    primary_key: "set_id"
    columns:
      - field: "set_id"
        header: "ID підходу"
        type: "string"
        pattern_ref: "id_policy.formats.set_id.pattern"
        nullable: false
        data_class: "source_fact"
      - field: "session_id"
        header: "ID сесії"
        type: "string"
        pattern_ref: "id_policy.formats.session_id.pattern"
        nullable: false
        data_class: "source_fact"
      - field: "program_item_id"
        header: "ID елемента програми"
        type: "string"
        pattern_ref: "id_policy.formats.program_item_id.pattern"
        nullable: true
        data_class: "source_fact"
      - field: "schema_version"
        header: "Версія схеми"
        type_ref: "common_types.schema_version"
        nullable: false
        data_class: "source_fact"
      - field: "program_version_id"
        header: "ID версії програми"
        type: "string"
        pattern_ref: "id_policy.formats.program_version_id.pattern"
        nullable: false
