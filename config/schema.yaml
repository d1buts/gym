local_models:
  source_record_version:
    data_class: "local_derived"
    fields:
      - "entity_type"
      - "entity_id"
      - "source_revision"
      - "snapshot_id"
      - "source_tab"
      - "source_row_number"
      - "source_payload_sha256"
      - "schema_version"
      - "observed_at"
    identity_uses_source_row_number: false
  set_component:
    data_class: "local_derived"
    primary_key:
      - "set_id"
      - "component_side"
    component_side_values:
      - "total"
      - "left"
      - "right"
    fields:
      - "set_id"
      - "component_side"
      - "reps"
      - "duration_seconds"
    logical_set_credit: 1
  normalized_record:
    data_class: "local_derived"
    required_lineage:
      - "snapshot_id"
      - "source_payload_sha256"
      - "schema_version"
      - "normalizer_version"
  metric_result:
    data_class: "local_derived"
    required_lineage:
      - "snapshot_id"
      - "schema_version"
      - "normalizer_version"
      - "formula_version"
      - "formula_id"
      - "parameters_json"
      - "contributing_entity_ids"
      - "excluded_entity_ids_with_reason"
  evidence_reference:
    type: "object"
    required:
      - "snapshot_id"
      - "entity_type"
      - "entity_id"
    properties:
      snapshot_id:
        type: "string"
        pattern_ref: "id_policy.formats.snapshot_id.pattern"
      entity_type:
        type: "string"
        allowed:
          - "session"
          - "set"
          - "program_item"
          - "metric_result"
      entity_id:
        type: "string"
        min_length: 1
        max_length: 200

conditional_rules:
  - id: "PROGRAM_REPETITION_TARGET"
    entity: "program_item"
    when: "measurement_kind in ['repetitions', 'repetitions_and_duration']"
    require:
      - "target_reps_min"
      - "target_reps_max"
    assert: "target_reps_min <= target_reps_max"
  - id: "PROGRAM_VERSION_METADATA_CONSISTENT"
    entity: "program_version"
    when: "always"
    assert: "all Program rows for program_version_id have identical group_entity.invariant_fields"
  - id: "PROGRAM_ONE_ACTIVE_VERSION"
    entity: "program_version_collection"
    when: "always"
    assert: "exactly one distinct program_version_id has program_version_status == 'active'"
  - id: "PROGRAM_VERSION_REFERENCEABLE"
    entity: "session"
    when: "always"
    assert: "referenced program_version_status in ['active', 'retired']"
  - id: "PROGRAM_DURATION_TARGET"
    entity: "program_item"
    when: "measurement_kind in ['duration', 'repetitions_and_duration']"
    require:
      - "target_duration_seconds_min"
      - "target_duration_seconds_max"
    assert: "target_duration_seconds_min <= target_duration_seconds_max"
  - id: "PROGRAM_RIR_RANGE"
    entity: "program_item"
    when: "always"
    assert: "target_rir_min <= target_rir_max"
  - id: "PROGRAM_REST_RANGE"
    entity: "program_item"
    when: "always"
    assert: "both rest bounds are null or both are present and rest_seconds_min <= rest_seconds_max"
  - id: "PROGRAM_COHORT_REQUIRES_EQUIPMENT_AND_SETUP"
    entity: "program_item"
    when: "equipment_id is null or setup_id is null"
    assert: "comparison_cohort_id is null"
  - id: "PROGRAM_LOAD_INCREMENT_TRIPLE"
    entity: "program_item"
    when: "any(load_increment_value, load_increment_unit, load_increment_basis) is present"
    require:
      - "load_increment_value"
      - "load_increment_unit"
      - "load_increment_basis"
  - id: "SESSION_COMPLETE_REQUIREMENTS"
    entity: "session"
    when: "status == 'complete'"
    require:
      - "completed_at"
    assert: "expected_set_count == count(non_void sets for session_id)"
  - id: "SESSION_VOID_REASON"
    entity: "session"
    when: "status == 'void'"
    require:
      - "void_reason"
  - id: "SESSION_BODY_MASS_PAIR"
    entity: "session"
    when: "any(body_mass_value, body_mass_unit) is present"
    require:
      - "body_mass_value"
      - "body_mass_unit"
  - id: "SET_PROGRAM_LINK"
    entity: "set"
    when: "set_role in ['working', 'backoff']"
    assert: "exactly one of program_item_id or unplanned_reason is present"
  - id: "SET_VERSION_MATCH"
    entity: "set"
    when: "always"
    assert: "program_version_id == referenced session.program_version_id"
  - id: "SET_PROGRAM_ITEM_VERSION_MATCH"
    entity: "set"
    when: "program_item_id is present"
    assert: "program_item_id exists in Program for program_version_id"
  - id: "SET_BODYWEIGHT_LOAD"
    entity: "set"
    when: "load_basis == 'bodyweight_only'"
    assert: "load_value is null and load_unit is null and implement_count is null"
  - id: "SET_EXTERNAL_LOAD"
    entity: "set"
    when: "load_basis != 'bodyweight_only' and status in ['completed', 'partial']"
    require:
      - "load_value"
      - "load_unit"
  - id: "SET_PER_IMPLEMENT_COUNT"
    entity: "set"
    when: "load_basis == 'per_implement'"
    require:
      - "implement_count"
  - id: "SET_TOTAL_COMPONENT"
    entity: "set"
    when: "laterality in ['bilateral', 'alternating_total'] and status in ['completed', 'partial']"
    forbid:
      - "reps_left"
      - "reps_right"
      - "duration_seconds_left"
      - "duration_seconds_right"
  - id: "SET_UNILATERAL_BOTH_COMPONENTS"
    entity: "set"
    when: "laterality == 'unilateral_both' and status == 'completed'"
    require_by_measurement:
      repetitions:
        - "reps_left"
        - "reps_right"
      duration:
        - "duration_seconds_left"
        - "duration_seconds_right"
      repetitions_and_duration:
        - "reps_left"
        - "reps_right"
        - "duration_seconds_left"
        - "duration_seconds_right"
    forbid:
      - "reps_total"
      - "duration_seconds_total"
  - id: "SET_UNILATERAL_BOTH_PARTIAL"
    entity: "set"
    when: "laterality == 'unilateral_both' and status == 'partial'"
    forbid:
      - "reps_total"
      - "duration_seconds_total"
  - id: "SET_LEFT_ONLY_COMPONENT"
    entity: "set"
    when: "laterality == 'left_only' and status in ['completed', 'partial']"
    forbid:
      - "reps_total"
      - "reps_right"
      - "duration_seconds_total"
      - "duration_seconds_right"
  - id: "SET_RIGHT_ONLY_COMPONENT"
    entity: "set"
    when: "laterality == 'right_only' and status in ['completed', 'partial']"
    forbid:
      - "reps_total"
      - "reps_left"
      - "duration_seconds_total"
      - "duration_seconds_left"
  - id: "SET_REPETITION_MEASURE"
    entity: "set"
    when: "measurement_kind == 'repetitions' and status in ['completed', 'partial']"
    assert: "at least one permitted reps component is present and every duration component is null"
  - id: "SET_DURATION_MEASURE"
    entity: "set"
    when: "measurement_kind == 'duration' and status in ['completed', 'partial']"
    assert: "at least one permitted duration component is present and every reps component is null"
  - id: "SET_BOTH_MEASURES"
    entity: "set"
    when: "measurement_kind == 'repetitions_and_duration' and status in ['completed', 'partial']"
    assert: "at least one permitted reps component and one permitted duration component are present"
  - id: "SET_SKIPPED"
    entity: "set"
    when: "status == 'skipped'"
    require:
      - "skip_reason"
    assert: "all performance components are null"
  - id: "SET_VOID"
    entity: "set"
    when: "status == 'void'"
    require:
      - "void_reason"
  - id: "SET_PAIN_DETAILS"
    entity: "set"
    when: "pain_score is present and pain_score > 0"
    require:
      - "pain_location"
  - id: "RECOMMENDATION_SCOPE_EXERCISE"
    entity: "recommendation"
    when: "scope in ['exercise_variant', 'exercise_family']"
    require:
      - "exercise_family_id"
  - id: "RECOMMENDATION_SCOPE_VARIANT"
    entity: "recommendation"
    when: "scope == 'exercise_variant'"
    require:
      - "exercise_variant_id"
      - "comparison_cohort_id"
  - id: "RECOMMENDATION_SCOPE_WORKOUT"
    entity: "recommendation"
    when: "scope == 'workout_type'"
    require:
      - "workout_type"
  - id: "RECOMMENDATION_GENERATED_PROVENANCE"
    entity: "recommendation"
    when: "generated_by in ['rules_engine', 'llm']"
    require:
      - "snapshot_id"
      - "normalizer_version"
      - "formula_version"
  - id: "RECOMMENDATION_RULE_PROVENANCE"
    entity: "recommendation"
    when: "generated_by == 'rules_engine'"
    require:
      - "rule_id"
      - "rule_version"
  - id: "RECOMMENDATION_DECISION"
    entity: "recommendation"
    when: "status in ['accepted', 'rejected']"
    require:
      - "decision_at"
  - id: "RECOMMENDATION_REVIEW"
    entity: "recommendation"
    when: "outcome is present"
    require:
      - "reviewed_at"
  - id: "RECOMMENDATION_VOID"
    entity: "recommendation"
    when: "status == 'void'"
    require:
      - "void_reason"

validation:
  severity_order:
    - "fatal"
    - "error"
    - "warning"
    - "info"
  severities:
    fatal:
      accepted_into_mirror: false
      advances_mirror_head: false
      scope: "entire_snapshot"
    error:
      accepted_into_mirror: false
      advances_mirror_head: false
      scope: "row_or_entity_group"
    warning:
      accepted_into_mirror: true
      scope: "row"
    info:
      accepted_into_mirror: true
      scope: "row_or_run"
  rules:
    - code: "TAB_MISSING"
      severity: "fatal"
      applies_to: "workbook"
      condition: "required tab is absent"
    - code: "REQUIRED_HEADER_MISSING"
      severity: "fatal"
      applies_to: "tab"
      condition: "any declared contract header is absent"
    - code: "UNKNOWN_HEADER"
      severity: "fatal"
      applies_to: "tab"
      condition: "a header is not declared by this schema version or an explicit versioned extension policy"
    - code: "SCHEMA_VERSION_UNSUPPORTED"
      severity: "fatal"
      applies_to: "row"
      condition: "schema_version is not in versions.schema.accepted"
    - code: "STABLE_ID_MISSING_OR_INVALID"
      severity: "error"
      applies_to: "row"
      condition: "source-owned primary ID is empty or violates its pattern"
    - code: "DUPLICATE_ID_CONFLICT"
      severity: "fatal"
      applies_to: "snapshot"
      condition: "same entity ID and source_revision have different payloads"
    - code: "DUPLICATE_ID_REDUNDANT"
      severity: "error"
      applies_to: "entity"
      condition: "same entity ID and source_revision appear more than once with byte-identical payloads"
    - code: "REVISION_REGRESSION"
      severity: "error"
      applies_to: "entity"
      condition: "source_revision is lower than the committed revision"
    - code: "WORKOUT_TYPE_INVALID"
      severity: "error"
      applies_to: "row"
      condition: "source label is not one of the four exact Ukrainian labels"
    - code: "PROGRAM_VERSION_UNKNOWN"
      severity: "error"
      applies_to: "session_or_set"
      condition: "program_version_id has no matching operational Program version"
    - code: "FOREIGN_KEY_MISSING"
      severity: "error"
      applies_to: "entity_group"
      condition: "set session_id or another required reference is unresolved"
    - code: "SESSION_NOT_COMPLETE"
      severity: "info"
      applies_to: "session"
      condition: "session status is writing; preserve in raw data and exclude from analytics"
    - code: "SESSION_SET_COUNT_MISMATCH"
      severity: "error"
      applies_to: "session_group"
      condition: "complete session expected_set_count differs from non-void set count"
    - code: "CONDITIONAL_FIELD_INVALID"
      severity: "error"
      applies_to: "row"
      condition: "a conditional_rules assertion fails"
    - code: "VALUE_OUT_OF_RANGE"
      severity: "error"
      applies_to: "field"
      condition: "typed value violates its declared minimum, maximum, or length"
    - code: "SHEET_FORMULA_VALUE_INVALID"
      severity: "warning"
      applies_to: "sheet_calculated_field"
      condition: "formula cache is absent, stale, or differs from local calculation"
    - code: "OPTIONAL_VALUE_MISSING"
      severity: "info"
      applies_to: "nullable_source_fact"
      condition: "nullable contextual value is empty"
    - code: "ROW_POSITION_USED_AS_IDENTITY"
      severity: "fatal"
      applies_to: "pipeline_configuration"
      condition: "an importer attempts to key an entity by sheet row number"
