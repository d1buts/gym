    reserve_capacity: 2048
    reserve_slot_prefix: "reserve:set:"
    primary_key: "set_id"
    freeze_rows: 1
    decorative_merged_cells: false
    input_fill: "#FFF7D6"
    system_fill: "#E2E8F0"
    editable_columns:
      - "session_id"
      - "program_item_id"
      - "status"
      - "set_number"
      - "performed_order"
      - "set_role"
      - "prescribed_optional"
      - "unplanned_reason"
      - "exercise_family_id"
      - "exercise_variant_id"
      - "comparison_cohort_id"
      - "equipment_id"
      - "setup_id"
      - "exercise_name"
      - "primary_muscle_group_id"
      - "measurement_kind"
      - "laterality"
      - "load_value"
      - "load_unit"
      - "load_basis"
      - "implement_count"
      - "reps_total"
      - "reps_left"
      - "reps_right"
      - "duration_seconds_total"
      - "duration_seconds_left"
      - "duration_seconds_right"
      - "rir"
      - "rest_seconds"
      - "pain_score"
      - "pain_location"
      - "technique_score"
      - "skip_reason"
      - "void_reason"
      - "notes"
    protected_columns:
      - "set_id"
      - "schema_version"
      - "program_version_id"
      - "source_revision"
      - "created_at"
      - "updated_at"
      - "session_date_sheet"
      - "workout_type_sheet"
      - "volume_sheet"
      - "volume_unit_sheet"
      - "e1rm_sheet"
      - "e1rm_unit_sheet"
      - "sheet_formula_version"
    column_order:
