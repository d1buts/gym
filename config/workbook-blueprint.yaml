      foreign_key: "session_id"
      foreign_key_named_range: "named_range:active_session_ids"
      version_match: "program_version_id == referenced session.program_version_id"
      program_item_named_range: "named_range:active_program_items"
      inactive_rows_are_facts: false
    protection:
      enforced: true
      warning_only: false

